# Experimental external nRF7002 patch storage (ordinary SPI NOR, not XIP).
# The patch must be provisioned separately before enabling Wi-Fi. See
# docs/wifi-patch-external-flash.md for partition migration and test limits.
SB_CONFIG_WIFI_NRF70=y
SB_CONFIG_WIFI_PATCHES_EXT_FLASH_STORE=y
# Factory-provisioned patch experiment: retain the existing two-image bootloader.
SB_CONFIG_CLIP_WIFI_PATCH_FACTORY_ONLY=y
SB_CONFIG_DFU_ZIP_WIFI_FW_PATCH=n
